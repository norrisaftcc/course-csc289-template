# course-manifest.yaml
# CSC 289: Programming Capstone
# Course Development Tracking System v0.1
#
# This manifest tracks teaching materials for CSC 289.
# Team progress is tracked via GitHub activity, not this manifest.
#
# Note: CSC 289 is a capstone course with team-based projects.
# Deliverables are primarily rubrics, guides, and templates rather than
# traditional readings and labs.

manifest_version: "0.1"
last_updated: "2024-12-26T00:00:00Z"

# ============================================================================
# COURSE METADATA
# ============================================================================
course:
  id: "CSC-289"
  name: "Programming Capstone"
  credits: 3
  
  description: |
    This capstone course integrates software development skills in a team-based 
    project environment. Students work in cross-functional teams to design, build, 
    and deploy a production-quality web application. Topics include agile methodology, 
    team collaboration, code review, deployment, and portfolio development. Upon 
    completion, students will have demonstrated professional-level software development 
    competency through a completed product and technical presentation.
  
  prerequisites:
    - "CTS-285"  # Or ORANGE clearance equivalent
  
  corequisites:
    - "GRD-Capstone"  # Design collaboration (optional but encouraged)
    - "DBA-289"       # Database specialists join dev teams
  
  repository_pattern: "capstone-{platform}-{team}"
  claude_project_id: ""
  
  # Clearance range for this course
  clearance:
    entry: "ORANGE"
    exit: "GREEN"
    milestones:
      - clearance: "YELLOW"
        target_week: 10
      - clearance: "GREEN"
        target_week: 14
  
  outcomes:
    - "Apply agile/Scrum methodology in a team software development context"
    - "Collaborate effectively with cross-functional team members"
    - "Design and implement a multi-tier web application with database backend"
    - "Conduct meaningful code reviews and respond to peer feedback"
    - "Deploy and maintain a production application"
    - "Present technical work to stakeholders through pitch and demo formats"
    - "Document architecture decisions and technical specifications"
    - "Demonstrate YELLOW and GREEN clearance competencies via exit tickets"

  # Key calendar milestones
  milestones:
    - name: "Pitch Presentations"
      week: 4
      description: "Teams present project vision and initial architecture"
    - name: "Design Handoff"
      week: 8
      description: "Design assets integrated, UI implementation begins"
    - name: "YELLOW Exit Tickets"
      week: 10
      description: "Individual competency demonstration"
    - name: "GREEN Exit Tickets"
      week: 13
      description: "Leadership and documentation competency"
    - name: "Demo Day"
      week: 15
      description: "Final product demonstration to stakeholders"

# ============================================================================
# PLATFORM DEFINITIONS
# ============================================================================
# Each team works on one of four platforms. Platform briefs are provided
# by instructor; teams build white-label applications on the platform.

platforms:
  - id: "task-management"
    name: "Task Management Platform"
    algocratic_variant: "TeamFlow™"
    technical_focus: "Multi-tenant workspaces, RBAC, hierarchies"
    db_focus: "Relational hierarchies, access control"
    
  - id: "ecommerce"
    name: "E-Commerce Platform"
    algocratic_variant: "ComplianceCart™"
    technical_focus: "Transaction integrity, state machines, inventory"
    db_focus: "Order processing, product catalogs"
    
  - id: "recommendation"
    name: "Recommendation Engine Platform"
    algocratic_variant: "PreferenceOptimizer™"
    technical_focus: "Similarity algorithms, preference modeling"
    db_focus: "Graph relationships, rating aggregation"
    
  - id: "health-tracker"
    name: "Health & Wellness Tracker Platform"
    algocratic_variant: "BiometricCompliance™"
    technical_focus: "Time-series data, privacy requirements"
    db_focus: "Temporal queries, data retention policies"

